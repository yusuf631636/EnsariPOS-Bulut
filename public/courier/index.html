<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>Kurye Bulut</title>
<link rel="manifest" href="/courier/manifest.webmanifest">
<link rel="icon" href="/courier/icons/icon-192.png">
<link rel="apple-touch-icon" href="/courier/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kurye">
<link rel="stylesheet" href="/courier/style.css">
</head>
<body>

<div id="loginView" class="screen">
  <div class="login-card">
    <h1>🛵 Kurye Girişi</h1>
    <p class="muted">İşletme adı (veya restoranın e-postası) ve PIN kodunuzu girin.</p>
    <input id="business" type="text" placeholder="İşletme adı veya e-posta" autocomplete="organization">
    <input id="pin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="PIN">
    <button id="loginBtn" class="primary">Giriş yap</button>
    <p id="loginErr" class="err" hidden></p>
    <a href="/kurye-restoran" class="admin-link">Restoran / yönetici girişi →</a>
  </div>
</div>

<div id="mainView" class="screen" hidden>
  <header>
    <div><b id="courierName">Kurye</b><span id="connDot" class="dot"></span></div>
    <div style="display:flex;gap:8px">
      <button id="themeToggle" class="ghost" aria-label="Tema değiştir">🌙</button>
      <button id="logoutBtn" class="ghost">Çıkış</button>
    </div>
  </header>
  <div id="empty" class="empty" hidden>Şu an size atanmış sipariş yok.</div>
  <div id="orders" class="orders"></div>
</div>

<div id="detailSheet" class="sheet" hidden>
  <div class="sheet-inner">
    <button id="closeDetail" class="close">✕</button>
    <h2 id="detailTitle">Sipariş içeriği</h2>
    <div id="detailBody"></div>
  </div>
</div>

<script src="/courier/app.js"></script>
</body>
</html>
